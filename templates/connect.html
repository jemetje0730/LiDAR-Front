<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 연결</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .input-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 200px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #status-message {
        margin-top: 10px;
        font-weight: bold;
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>LiDAR 장치 연결</h2>
      <div class="input-group">
        <label for="ip-input">IP 주소:</label>
        <input type="text" id="ip-input" placeholder="예: 0.0.0.0" />
      </div>
      <div class="input-group">
        <label for="port-input">포트 번호:</label>
        <input type="number" id="port-input" placeholder="예: 5000" />
      </div>
      <button onclick="connectToDevice()">연결</button>
      <div id="status-message"></div>
    </div>

    <script>
      async function connectToDevice() {
        const ip = document.getElementById("ip-input").value;
        const port = document.getElementById("port-input").value;
        const statusMessage = document.getElementById("status-message");

        if (!ip || !port) {
          statusMessage.textContent = "IP와 포트를 입력해주세요.";
          return;
        }

        try {
          const response = await fetch("http://127.0.0.1:8000/setup_lidar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ip: ip, port: parseInt(port) }),
          });

          const data = await response.json();
          if (data.status === "success") {
            statusMessage.style.color = "green";
            statusMessage.textContent = `✅ 연결 성공: ${ip}:${port}`;
            setTimeout(() => {
              window.location.href = "/index"; // 성공 시 데이터 페이지로 이동
            }, 1000);
          } else {
            statusMessage.textContent = `❌ 연결 실패: ${data.detail}`;
          }
        } catch (error) {
          statusMessage.textContent = "❌ 서버 오류";
        }
      }
    </script>
  </body>
</html>
