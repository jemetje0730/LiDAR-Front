<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 연결</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }
      .container {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .input-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input {
        width: 200px;
        padding: 8px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #status-message {
        margin-top: 10px;
        font-weight: bold;
        color: red;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>LiDAR 장치 연결</h2>
      <div class="input-group">
        <label for="ip-input">IP 주소:</label>
        <input type="text" id="ip-input" placeholder="예: 192.168.123.100" />
      </div>
      <div class="input-group">
        <label for="port-input">포트 번호:</label>
        <input type="number" id="port-input" placeholder="예: 5000" />
      </div>
      <button onclick="connectToDevice()">연결</button>
      <div id="status-message"></div>
    </div>

    <script>
      async function connectToDevice() {
        const ip = document.getElementById("ip-input").value;
        const port = document.getElementById("port-input").value;
        const statusMessage = document.getElementById("status-message");

        if (!ip || !port) {
          statusMessage.textContent = "IP 주소와 포트 번호를 입력해주세요.";
          return;
        }

        try {
          console.log(`🔄 LiDAR 설정 중... IP: ${ip}, 포트: ${port}`);

          // ✅ 올바른 JSON 형식으로 요청 보내기
          let setupResponse = await fetch("http://127.0.0.1:8000/setup_lidar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ip: ip, port: Number(port) }), // ✅ port를 숫자로 변환
          });

          let setupData = await setupResponse.json();
          console.log("⚙️ LiDAR 설정 응답:", setupData);

          if (setupData.status !== "success") {
            statusMessage.textContent = `❌ 설정 실패: ${setupData.message}`;
            return;
          }

          // 설정이 완료되면 연결 확인 API 호출
          let checkResponse = await fetch(
            `http://127.0.0.1:8000/check_connection?ip=${ip}&port=${port}`
          );
          let checkData = await checkResponse.json();
          console.log("📡 연결 확인 응답:", checkData);

          if (checkData.status === "success") {
            statusMessage.style.color = "green";
            statusMessage.textContent = `✅ 연결 성공! (${ip}:${port})`;
            localStorage.setItem("lidar_ip", ip);
            localStorage.setItem("lidar_port", port);
            setTimeout(() => {
              window.location.href = "/index";
            }, 1000);
          } else {
            statusMessage.textContent = `❌ 연결 실패: ${checkData.message}`;
          }
        } catch (error) {
          statusMessage.textContent = `❌ 연결 실패: 서버 응답 없음`;
          console.error("❌ 오류 발생:", error);
        }
      }
    </script>
  </body>
</html>
