<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 연결</title>
  </head>
  <body>
    <h2>LiDAR 장치 연결</h2>
    <label for="ip-input">IP 주소:</label>
    <input type="text" id="ip-input" placeholder="예: 192.168.123.100" />
    <label for="port-input">포트 번호:</label>
    <input type="number" id="port-input" placeholder="예: 5000" />
    <button onclick="connectToDevice()">연결</button>
    <div id="status-message"></div>

    <script>
        async function connectToDevice() {
          const ip = document.getElementById("ip-input").value;
          const port = document.getElementById("port-input").value;
          const statusMessage = document.getElementById("status-message");
      
          if (!ip || !port) {
            statusMessage.textContent = "IP 주소와 포트 번호를 입력해주세요.";
            return;
          }
      
          try {
            console.log(`🔄 연결 시도 중... IP: ${ip}, 포트: ${port}`);
            const response = await fetch(`http://127.0.0.1:8000/check_connection?ip=${ip}&port=${port}`);
            const data = await response.json();
            console.log("📡 서버 응답:", data);
      
            if (data.success) {
              statusMessage.textContent = "✅ 연결 성공! LiDAR 데이터를 수신 중...";
              localStorage.setItem("lidar_ip", ip);
              localStorage.setItem("lidar_port", port);
              window.location.href = "index.html";  // ✅ 연결 성공하면 index.html로 이동
            } else {
              statusMessage.textContent = `❌ 연결 실패: ${data.message}`;
            }
          } catch (error) {
            statusMessage.textContent = `❌ 연결 오류: ${error.message}`;
            console.error("⚠️ LiDAR 연결 요청 실패:", error);
          }
        }
      </script>
      
  </body>
</html>
