<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiDAR 연결</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 280px; /* 컨테이너 너비 조정 */
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 93%; /* ✅ 입력 필드 너비 조정 */
            max-width: 220px; /* ✅ 최대 너비 설정 */
            padding: 6px;
            font-size: 14px; /* ✅ 글자 크기 조정 */
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 80%;
            max-width: 220px; /* 버튼 너비도 조정 */
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>LiDAR 장치 연결</h2>
        <div class="input-group">
            <label for="ip">IP 주소:</label>
            <input type="text" id="ip" placeholder="예: 192.168.1.100">
        </div>
        <div class="input-group">
            <label for="port">포트 번호:</label>
            <input type="number" id="port" placeholder="예: 5000">
        </div>
        <button onclick="connectToDevice()">연결</button>
        <p id="status-message"></p>
    </div>

    <script>
        async function connectToDevice() {
            const ip = document.getElementById("ip").value.trim();
            const port = document.getElementById("port").value.trim();
            const statusMessage = document.getElementById("status-message");

            // ✅ 입력 검증
            if (!validateIP(ip)) {
                statusMessage.textContent = "❌ 올바른 IP 주소를 입력하세요.";
                statusMessage.style.color = "red";
                return;
            }
            if (!port || isNaN(port) || port < 1 || port > 65535) {
                statusMessage.textContent = "❌ 유효한 포트 번호를 입력하세요.";
                statusMessage.style.color = "red";
                return;
            }

            // ✅ 서버에 연결 요청
            try {
                const response = await fetch("http://127.0.0.1:8000/connect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ip, port: parseInt(port) })
                });

                const data = await response.json();
                if (data.success) {
                    statusMessage.textContent = `✅ 연결 성공: ${ip}:${port}`;
                    statusMessage.style.color = "green";
                    setTimeout(() => {
                        window.location.href = "/index"; // 연결 성공 시 index.html로 이동
                    }, 1000);
                } else {
                    statusMessage.textContent = `❌ 연결 실패: ${data.message || "알 수 없는 오류"}`;
                    statusMessage.style.color = "red";
                }
            } catch (error) {
                statusMessage.textContent = "❌ 서버 연결 실패";
                statusMessage.style.color = "red";
            }
        }

        function validateIP(ip) {
            const ipPattern = /^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$/;
            return ipPattern.test(ip);
        }
    </script>
</body>
</html>
