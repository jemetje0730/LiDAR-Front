<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiDAR 연결</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 93%;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>LiDAR 장치 연결</h2>
        <div class="input-group">
            <label for="ip">IP 주소:</label>
            <input type="text" id="ip" placeholder="예: 192.168.1.100">
        </div>
        <div class="input-group">
            <label for="port">포트 번호:</label>
            <input type="number" id="port" placeholder="예: 5000">
        </div>
        <button onclick="connectToDevice()">연결</button>
        <p id="status-message"></p>
    </div>

    <script>
        async function connectToDevice() {
            const ip = document.getElementById("ip").value.trim();
            const port = document.getElementById("port").value.trim();
            const statusMessage = document.getElementById("status-message");

        if (!ip || !port) {
          statusMessage.textContent = "IP 주소와 포트 번호를 입력해주세요.";
          return;
        }

        try {
          console.log(`🔄 연결 시도 중... IP: ${ip}, 포트: ${port}`);
          const response = await fetch(
            `http://127.0.0.1:8000/check_connection?ip=${ip}&port=${port}`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
              },
            }
          );
          const data = await response.json();
          console.log("📡 서버 응답:", data);

          if (data.status === "success") {
            statusMessage.style.color = "green";
            statusMessage.textContent = `✅ 연결 성공! (${ip}:${port})`;
            localStorage.setItem("lidar_ip", ip);
            localStorage.setItem("lidar_port", port);
            window.location.href = "/index";
          } else {
            statusMessage.textContent = `❌ 연결 실패 ${data.message}`;
          }
        } catch (error) {
          statusMessage.textContent = `❌ 연결 실패: 서버 응답 없음`;
        }

        function validateIP(ip) {
            const ipPattern = /^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}$/;
            return ipPattern.test(ip);
        }
    </script>
</body>
</html>
