<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LiDAR 3D Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      /* 사이드바 스타일 */
      #sidebar {
        position: absolute;
        left: -280px; /* 기본적으로 숨김 */
        top: 0;
        width: 280px;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        padding: 15px;
        transition: left 0.3s ease-in-out;
        color: white;
        overflow-y: auto;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
      }
      #sidebar.show {
        left: 0;
      }
      #menu-btn {
        position: absolute;
        top: 10px;
        left: 40px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #close-btn {
        display: block;
        margin-top: 15px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #reset-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #info-box {
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        max-height: 300px;
        overflow-y: auto;
        color: black;
      }
      #distance-table {
        width: 100%;
        border-collapse: collapse;
      }
      #distance-table th,
      #distance-table td {
        border: 1px solid #ddd;
        padding: 5px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <button id="menu-btn">☰</button>
    <button id="reset-btn">줌 초기화</button>

    <!-- ✅ 사이드바 -->
    <div id="sidebar">
      <h3>📌 LiDAR 설정</h3>
      <button id="close-btn">닫기</button>

      <h3>📌 LiDAR 거리 데이터</h3>
      <div id="info-box">
        <table id="distance-table">
          <tr>
            <th>#</th>
            <th>각도 (°)</th>
            <th>채널 1 (m)</th>
            <th>채널 2 (m)</th>
            <th>채널 3 (m)</th>
            <th>채널 4 (m)</th>
          </tr>
        </table>
      </div>

      <h3>📌 GetConfig</h3>
      <button
        id="outputChannelBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Output Channel
      </button>

      <!-- Output Channel 옵션 -->
      <div
        id="outputChannelOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH1" /> CH1
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH2" /> CH2
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH3" /> CH3
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH4" /> CH4
        </label>
        <button
          id="setOutputChannel"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>

      <!-- Self Check Active State 버튼 -->
      <button
        id="selfCheckBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Self Check Active State
      </button>

      <!-- Low / High 옵션 창 -->
      <div
        id="selfCheckOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label style="color: black; display: block; padding: 5px 0">
          <input type="radio" name="selfCheck" value="Low" /> Low
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="radio" name="selfCheck" value="High" /> High
        </label>
        <button
          id="setSelfCheck"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
      <button
        id="pulseDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Pulse Data
      </button>

      <!-- Pulse Data 설정 옵션 -->
      <div
        id="pulseDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="pulseDataValue"
          style="color: black; display: block; padding: 5px 0"
          >Pulse Value (0-1000ms):</label
        >
        <input
          type="range"
          id="pulseDataValue"
          min="0"
          max="1000"
          step="100"
          value="0"
          style="width: 100%"
        />
        <span
          id="pulseDataValueLabel"
          style="display: block; text-align: center"
          >0</span
        >

        <button
          id="setPulseData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>

      <button
        id="angleDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Angle Data
      </button>

      <!-- Angle Data 설정 옵션 -->
      <div
        id="angleDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="minAngleValue"
          style="color: black; display: block; padding: 5px 0"
          >Min Angle (0-100°):</label
        >
        <input
          type="range"
          id="minAngleValue"
          min="0"
          max="100"
          step="1"
          value="0"
          style="width: 100%"
        />
        <span id="minAngleValueLabel" style="display: block; text-align: center"
          >0°</span
        >

        <label
          for="maxAngleValue"
          style="color: black; display: block; padding: 5px 0"
          >Max Angle (0-100°):</label
        >
        <input
          type="range"
          id="maxAngleValue"
          min="0"
          max="100"
          step="1"
          value="100"
          style="width: 100%"
        />
        <span id="maxAngleValueLabel" style="display: block; text-align: center"
          >100°</span
        >
        <button
          id="setAngleData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
      <button
        id="distanceRangeBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Distance Range
      </button>

      <!-- Distance Range 설정 옵션 -->
      <div id="distanceRangeOptions" style="display: none">
        <label>Min Distance: <span id="minDistanceLabel">0m</span></label>
        <input type="range" id="minDistance" min="0" max="49" value="0" />

        <label>Max Distance: <span id="maxDistanceLabel">50m</span></label>
        <input type="range" id="maxDistance" min="1" max="50" value="50" />

        <button id="setDistanceRange">설정</button>
      </div>
      <button
        id="areaDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Area Data
      </button>

      <!-- Area Data 설정 옵션 -->
      <div
        id="areaDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="areaDataValue"
          style="color: black; display: block; padding: 5px 0"
          >Area Size (0-255cm):</label
        >
        <input
          type="range"
          id="areaDataValue"
          min="0"
          max="255"
          step="1"
          value="0"
          style="width: 100%"
        />
        <span id="areaDataValueLabel" style="display: block; text-align: center"
          >0cm</span
        >

        <button
          id="setAreaData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
    </div>

    <script>
      // ✅ 사이드바 토글 기능
      const menuBtn = document.getElementById("menu-btn");
      const sidebar = document.getElementById("sidebar");
      const closeBtn = document.getElementById("close-btn");

      menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("show");
      });

      closeBtn.addEventListener("click", () => {
        sidebar.classList.remove("show");
      });
    </script>

    <script>
      // Area Data 버튼 클릭 시 설정 옵션 토글
      document.getElementById("areaDataBtn").addEventListener("click", () => {
        const options = document.getElementById("areaDataOptions");
        options.style.display =
          options.style.display === "none" ? "block" : "none";
      });

      // Area Size 범위 값 표시 업데이트
      document
        .getElementById("areaDataValue")
        .addEventListener("input", (event) => {
          const value = event.target.value;
          document.getElementById("areaDataValueLabel").innerText =
            value + "cm";
        });

      // Area Data 설정 버튼 클릭 시 서버로 값 전송
      document.getElementById("setAreaData").addEventListener("click", () => {
        const areaValue = document.getElementById("areaDataValue").value;

        alert(`Area Data 설정: ${areaValue}cm`);

        // 서버로 Area Data 값 전송 (예제 API 호출)
        fetch("http://127.0.0.1:8000/set_area_data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ area_data: parseInt(areaValue) }),
        })
          .then((response) => response.json())
          .then((data) => console.log("Area Data 설정 완료:", data))
          .catch((error) => console.error("설정 오류:", error));
      });
    </script>

    <script>
      // Distance Range 버튼 클릭 시 설정 옵션 토글
      document
        .getElementById("distanceRangeBtn")
        .addEventListener("click", () => {
          const options = document.getElementById("distanceRangeOptions");
          options.style.display =
            options.style.display === "none" || options.style.display === ""
              ? "block"
              : "none";
        });

      // Max Distance 범위 값 표시 업데이트
      document
        .getElementById("maxDistance") // 올바른 ID 사용
        .addEventListener("input", (event) => {
          const value = event.target.value;
          document.getElementById("maxDistanceLabel").innerText = `${value}m`;
        });

      // Min Distance 범위 값 표시 업데이트
      document
        .getElementById("minDistance") // 올바른 ID 사용
        .addEventListener("input", (event) => {
          const value = event.target.value;
          document.getElementById("minDistanceLabel").innerText = `${value}m`;
        });

      // Distance Range 설정 버튼 클릭 시 서버로 값 전송
      document
        .getElementById("setDistanceRange")
        .addEventListener("click", () => {
          const minDistance = parseInt(
            document.getElementById("minDistance").value
          );
          const maxDistance = parseInt(
            document.getElementById("maxDistance").value
          );

          if (
            isNaN(minDistance) ||
            isNaN(maxDistance) ||
            minDistance < 0 ||
            maxDistance > 50 ||
            minDistance >= maxDistance
          ) {
            alert("❌ 유효한 거리 범위를 입력하세요! (0~50m, min < max)");
            return;
          }

          console.log(
            `📤 Distance Range 설정 요청: min=${minDistance}m, max=${maxDistance}m`
          );

          fetch("http://127.0.0.1:8000/set_distance_range", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              min_distance: minDistance,
              max_distance: maxDistance,
            }),
          })
            .then((response) => response.json())
            .then((data) => {
              console.log("✅ Distance Range 설정 완료:", data);
              alert(`✅ 설정 완료: min=${minDistance}, max=${maxDistance}`);
            })
            .catch((error) => {
              console.error("❌ 설정 오류:", error);
              alert("❌ Distance Range 설정 실패!");
            });
        });
    </script>

    <script>
      // Pulse Data 버튼 클릭 시 설정 옵션 토글
      document.getElementById("pulseDataBtn").addEventListener("click", () => {
        const options = document.getElementById("pulseDataOptions");
        options.style.display =
          options.style.display === "none" ? "block" : "none";
      });

      // Pulse Value 범위 값 표시 업데이트
      document
        .getElementById("pulseDataValue")
        .addEventListener("input", (event) => {
          const value = event.target.value;
          document.getElementById("pulseDataValueLabel").innerText = value;
        });

      // Pulse Data 설정 버튼 클릭 시 서버로 값 전송
      document.getElementById("setPulseData").addEventListener("click", () => {
        const pulseValue = document.getElementById("pulseDataValue").value;

        alert(`Pulse Data 설정: ${pulseValue}`);

        // 서버로 Pulse Data 값 전송 (예제 API 호출)
        fetch("http://127.0.0.1:8000/set_pulse_data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ value: parseInt(pulseValue) }),
        })
          .then((response) => response.json())
          .then((data) => console.log("Pulse Data 설정 완료:", data))
          .catch((error) => console.error("설정 오류:", error));
      });
    </script>

    <script>
      // Angle Data 버튼 클릭 시 설정 옵션 토글
      document.getElementById("angleDataBtn").addEventListener("click", () => {
        const options = document.getElementById("angleDataOptions");
        options.style.display =
          options.style.display === "none" ? "block" : "none";
      });

      document
        .getElementById("minAngleValue")
        .addEventListener("input", (event) => {
          document.getElementById("minAngleValueLabel").innerText =
            event.target.value + "°";
        });

      document
        .getElementById("maxAngleValue")
        .addEventListener("input", (event) => {
          document.getElementById("maxAngleValueLabel").innerText =
            event.target.value + "°";
        });

      document.getElementById("setAngleData").addEventListener("click", () => {
        const minAngle = parseInt(
          document.getElementById("minAngleValue").value
        );
        const maxAngle = parseInt(
          document.getElementById("maxAngleValue").value
        );

        if (minAngle > maxAngle) {
          alert("Min Angle은 Max Angle보다 클 수 없습니다.");
          return;
        }

        // ✅ 서버로 Angle Data 전송
        fetch("http://127.0.0.1:8000/set_angle_data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ min_angle: minAngle, max_angle: maxAngle }), // ✅ JSON 키 수정
        })
          .then((response) => response.json())
          .then((data) => console.log("✅ Angle Data 설정 완료:", data))
          .catch((error) => console.error("❌ 설정 오류:", error));
      });
    </script>

    <script>
      document
        .getElementById("outputChannelBtn")
        .addEventListener("click", () => {
          const options = document.getElementById("outputChannelOptions");
          options.style.display =
            options.style.display === "none" ? "block" : "none";
        });

      document
        .getElementById("setOutputChannel")
        .addEventListener("click", () => {
          const selectedChannels = Array.from(
            document.querySelectorAll("input[name='outputChannel']:checked")
          ).map((el) => el.value);
          if (selectedChannels.length > 0) {
            alert(`Output Channel 설정: ${selectedChannels.join(", ")}`);
            document.getElementById("outputChannelOptions").style.display =
              "none";

            // bit 값 계산
            let outputChannelData = 0;
            selectedChannels.forEach((channel) => {
              const index = parseInt(channel.replace("CH", ""));
              outputChannelData |= 1 << (index - 1); // LSB부터 할당
            });

            // Output Channel을 서버에 전송
            fetch("http://127.0.0.1:8000/set_output_channel", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ output_channel: outputChannelData }),
            })
              .then((response) => response.json())
              .then((data) => {
                console.log("Output Channel 설정 완료:", data);
                // ED 패킷 전송 성공 시, 추가로 ED 요청 전송
                if (data.config_response) {
                  alert("ED 패킷 전송 성공!");
                }
              })
              .catch((error) => console.error("설정 오류:", error));
          } else {
            alert("최소 하나의 채널을 선택하세요.");
          }
        });
    </script>

    <script>
      document.getElementById("selfCheckBtn").addEventListener("click", () => {
        const options = document.getElementById("selfCheckOptions");
        options.style.display =
          options.style.display === "none" ? "block" : "none";
      });

      document.getElementById("setSelfCheck").addEventListener("click", () => {
        const selectedOption = document.querySelector(
          "input[name='selfCheck']:checked"
        );
        if (selectedOption) {
          alert(`Self Check Active State 설정: ${selectedOption.value}`);
          document.getElementById("selfCheckOptions").style.display = "none";

          // 서버로 설정값 전송 (예제 API 호출)
          fetch("http://127.0.0.1:8000/set_self_check", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ state: selectedOption.value }),
          })
            .then((response) => response.json())
            .then((data) => console.log("설정 완료:", data))
            .catch((error) => console.error("설정 오류:", error));
        } else {
          alert("옵션을 선택하세요.");
        }
      });
    </script>

    <script>
      // 📌 초기 카메라 위치 저장
      const initialCameraPosition = new THREE.Vector3(0, 0, 20);
      const initialTarget = new THREE.Vector3(0, 0, 0);

      // 📌 초기화 버튼 클릭 이벤트
      document.getElementById("reset-btn").addEventListener("click", () => {
        camera.position.copy(initialCameraPosition);
        controls.target.copy(initialTarget);
        controls.update();
      });
    </script>

    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.enablePan = true;

      const axesHelper = new THREE.AxesHelper(1);
      axesHelper.renderOrder = 1;
      axesHelper.material.depthTest = false;
      scene.add(axesHelper);

      camera.position.set(0, 0, 20);
      camera.lookAt(0, 0, 0);
      controls.update();

      const distanceLabels = [];
      function createDistanceCirclesWithLabels() {
        for (let i = 1; i <= 20; i++) {
          const points = [];
          for (let j = 0; j <= 64; j++) {
            const angle = (j / 64) * Math.PI * 2;
            points.push(
              new THREE.Vector3(Math.cos(angle) * i, Math.sin(angle) * i, 0)
            );
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({ color: 0x444444 });
          const circle = new THREE.LineLoop(geometry, material);
          scene.add(circle);

          const label = document.createElement("div");
          label.className = "distance-label";
          label.innerText = `${i}m`;
          document.body.appendChild(label);
          distanceLabels.push({ element: label, distance: i });
        }
      }

      function updateDistanceLabels() {
        const minDistance = parseInt(
          document.getElementById("minDistance").value
        );
        const maxDistance = parseInt(
          document.getElementById("maxDistance").value
        );

        document.getElementById("minDistanceLabel").innerText =
          minDistance + "m";
        document.getElementById("maxDistanceLabel").innerText =
          maxDistance + "m";
      }

      function createGrid(size) {
        const gridHelper = new THREE.GridHelper(
          size * 2,
          size * 2,
          0x333333,
          0x333333
        );
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
      }

      createDistanceCirclesWithLabels();
      createGrid(20);

      let pointClouds = {};
      const channelColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffa500];
      const verticalAngles = [-1.07, 0, 1.07, 2];

      function initPointClouds(channelCount) {
        for (let i = 0; i < channelCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const material = new THREE.PointsMaterial({
            color: channelColors[i % 4],
            size: 0.05, // ✅ 포인트 크기 조정
            transparent: true,
            opacity: 0.9,
          });

          pointClouds[i] = new THREE.Points(geometry, material);
          scene.add(pointClouds[i]);

          console.log(`✅ 채널 ${i} 포인트 클라우드 추가됨`); // ✅ 추가 확인 로그
        }
      }

      // ✅ LiDAR 포인트 클라우드 업데이트 함수 수정
      let ws = new WebSocket("ws://127.0.0.1:8000/ws/lidar");

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (!data.lidar_data || !data.distances) return;

        console.log("📡 WebSocket 데이터 수신:", data);

        updatePointCloud(data.lidar_data, 4);
        updateDistanceTable(data.distances); // ✅ 거리 테이블도 업데이트
      };

      function updatePointCloud(lidarData, channelCount) {
        const angleOffset = Math.PI / 4 - Math.PI / 36; // 45도 - 5도 = 40도

        for (let i = 0; i < channelCount; i++) {
          if (lidarData[i] && lidarData[i].length > 0) {
            const points = lidarData[i].map((p) => {
              const x =
                p.x * Math.cos(angleOffset) - p.y * Math.sin(angleOffset);
              const y =
                p.x * Math.sin(angleOffset) + p.y * Math.cos(angleOffset);
              return new THREE.Vector3(x, y, p.z);
            });

            if (pointClouds[i].geometry) {
              pointClouds[i].geometry.dispose();
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            pointClouds[i].geometry = geometry;
          }
        }
      }

      function updateDistanceTable(distances) {
        let table = document.getElementById("distance-table");
        let html = `<tr>
          <th>#</th>
          <th>각도 (°)</th>
          <th>채널 1 (m)</th>
          <th>채널 2 (m)</th>
          <th>채널 3 (m)</th>
          <th>채널 4 (m)</th>
      </tr>`;

        for (let i = 0; i < 400; i++) {
          // ✅ 각도 400개 기준으로 업데이트
          const angle = (i * 0.25).toFixed(2);

          // ✅ 거리 값 처리 (최대 50m 제한 & 소수 둘째 자리까지 표시)
          const formatDistance = (d) =>
            d !== undefined ? Math.min(50, parseFloat(d)).toFixed(2) : "-";

          const dist0 = formatDistance(distances[0]?.[i]?.distance);
          const dist1 = formatDistance(distances[1]?.[i]?.distance);
          const dist2 = formatDistance(distances[2]?.[i]?.distance);
          const dist3 = formatDistance(distances[3]?.[i]?.distance);

          html += `<tr>
          <td>${i}</td>
          <td>${angle}</td>
          <td>${dist0}</td>
          <td>${dist1}</td>
          <td>${dist2}</td>
          <td>${dist3}</td>
      </tr>`;
        }
        table.innerHTML = html;
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        updateDistanceLabels();
      }
      animate();
      initPointClouds(4);
    </script>
  </body>
</html>
