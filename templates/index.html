<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 최신 데이터</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .charts-wrapper {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        width: 100%;
        margin-bottom: 40px;
      }
      .canvas-wrapper {
        position: relative;
        width: 45vw;
        max-width: 600px;
      }
      .canvas-wrapper::before {
        content: "";
        display: block;
        padding-top: 100%;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .info-box-wrapper {
        display: flex;
        justify-content: space-between;
        width: 90%;
      }
      .info-box {
        width: 300px;
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        background: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 6px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h2>LiDAR 최신 데이터</h2>
    <button onclick="fetchLidarData()">최신 LiDAR 데이터 가져오기</button>
    <button onclick="fetchCloudPointData()">
      클라우드 포인트 데이터 가져오기
    </button>
    <!-- Cloud Point 데이터 추가 -->
    <button onclick="resetZoom()">줌 초기화</button>

    <div class="container">
      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="lidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 LiDAR 포인트 정보</h3>
          <table>
            <thead>
              <tr>
                <th>각도(°)</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>거리(m)</th>
                <th>초기거리</th>
              </tr>
            </thead>
            <tbody id="lidar-point-info"></tbody>
          </table>
        </div>
      </div>

      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="cloudLidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 Cloud 포인트 정보</h3>
          <table>
            <thead>
              <tr>
                <th>각도(°)</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>거리(m)</th>
                <th>초기거리</th>
              </tr>
            </thead>
            <tbody id="cloud-point-info"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("lidarChart").getContext("2d");
      const cloudCtx = document
        .getElementById("cloudLidarChart")
        .getContext("2d");

      const chart = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "LiDAR Points (UDP)",
              data: [],
              borderColor: "blue",
              backgroundColor: "rgba(0, 0, 255, 0.5)",
              pointRadius: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: true,
          responsive: true,
          aspectRatio: 1, // 가로와 세로의 비율을 1:1로 설정 (정사각형 모양)
          layout: { padding: 0 },
          scales: {
            x: {
              min: -25,
              max: 25, // LiDAR와 Cloud 포인트의 범위를 동일하게 맞춤
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
            y: {
              min: -25,
              max: 25, // LiDAR와 Cloud 포인트의 범위를 동일하게 맞춤
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
          },
          plugins: {
            legend: { display: true },
            zoom: {
              pan: { enabled: true, mode: "xy" },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: "xy",
              },
            },
          },
        },
      });

      const cloudChart = new Chart(cloudCtx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "LiDAR Points (Cloud)",
              data: [],
              borderColor: "red",
              backgroundColor: "rgba(255, 0, 0, 0.5)",
              pointRadius: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: true,
          responsive: true,
          aspectRatio: 1, // 가로와 세로의 비율을 1:1로 설정 (정사각형 모양)
          layout: { padding: 0 },
          scales: {
            x: {
              min: -25,
              max: 25, // LiDAR와 Cloud 포인트의 범위를 동일하게 맞춤
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
            y: {
              min: -25,
              max: 25, // LiDAR와 Cloud 포인트의 범위를 동일하게 맞춤
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
          },
          plugins: {
            legend: { display: true },
            zoom: {
              pan: { enabled: true, mode: "xy" },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: "xy",
              },
            },
          },
        },
      });

      // 페이지 로드 시 자동으로 데이터 가져오기
      window.onload = function () {
        // 5초마다 최신 LiDAR 데이터와 Cloud Point 데이터를 가져옵니다.
        setInterval(fetchLidarData, 5000); // 5000ms = 5초
        setInterval(fetchCloudPointData, 5000); // 5000ms = 5초
      };

      // ✅ 최신 LiDAR 데이터 가져오기
      async function fetchLidarData() {
        try {
          console.log("🔄 LiDAR 데이터 요청 중...");
          const response = await fetch("http://127.0.0.1:8000/lidar_data");
          const data = await response.json();
          console.log("📡 응답 데이터:", data);

          if (data.latest_lidar_xyz_points) {
            let angle = 0.0;
            const angleStep = 0.25;
            const points = data.latest_lidar_xyz_points.map((p) => {
              console.log("Raw distance:", p.raw_distance);
              console.log("Calculated distance:", p.distance);

              return {
                x: p.x,
                y: p.y,
                z: p.z,
                distance: p.distance, // distance는 calculated distance
                angle: (angle += angleStep).toFixed(2),
                raw_distance: p.raw_distance, // raw_distance를 별도로 저장
              };
            });

            // 데이터가 정확히 처리되고 있는지 확인
            console.log("변환된 LiDAR 포인트 데이터:", points.slice(0, 5));
            chart.data.datasets[0].data = points;
            chart.update();
            updatePointInfo(points, "lidar");
          }
        } catch (error) {
          console.error("⚠️ LiDAR 데이터 가져오기 실패:", error);
        }
      }

      // ✅ 클라우드 포인트 데이터 가져오기
      async function fetchCloudPointData() {
        try {
          console.log("🔄 Cloud LiDAR 데이터 요청 중...");
          const response = await fetch(
            "http://127.0.0.1:8000/cloud_point_data"
          );
          console.log("📡 응답 상태 코드:", response.status);

          const data = await response.json();
          console.log("✅ 변환된 Cloud 데이터:", data);

          if (
            data.latest_cloud_point_xyz_points &&
            data.latest_cloud_point_xyz_points.length > 0
          ) {
            let angle = 0.0;
            const angleStep = 0.25; // Cloud 포인트 데이터 각도 간격 (0.25도)
            const cloudPoints = data.latest_cloud_point_xyz_points.map((p) => {
              return {
                x: p.x,
                y: p.y,
                z: p.z,
                distance: p.distance,
                angle: (angle += angleStep).toFixed(2),
              };
            });

            console.log(
              "📡 변환된 Cloud 포인트 데이터:",
              cloudPoints.slice(0, 5)
            );

            // Cloud 데이터는 두 번째 차트에 업데이트
            cloudChart.data.datasets[0].data = cloudPoints;
            cloudChart.update();

            updatePointInfo(cloudPoints, "cloud"); // Cloud 데이터만 포인트 정보 업데이트
          } else {
            console.log("❌ 새로운 Cloud 포인트 데이터가 없습니다.");
          }
        } catch (error) {
          console.error("⚠️ Cloud LiDAR 데이터 가져오기 실패:", error);
        }
      }

      // 줌 리셋 함수
      function resetZoom() {
        chart.resetZoom();
        cloudChart.resetZoom();
      }

      function updatePointInfo(points, type) {
        const infoBoxId =
          type === "lidar" ? "lidar-point-info" : "cloud-point-info";
        const infoBox = document.getElementById(infoBoxId);
        infoBox.innerHTML = ""; // 기존 정보 삭제

        points.forEach((point) => {
          let row = document.createElement("tr");

          let angleCell = document.createElement("td");
          angleCell.textContent = `${point.angle}°`;

          let xCell = document.createElement("td");
          xCell.textContent = point.x.toFixed(2);

          let yCell = document.createElement("td");
          yCell.textContent = point.y.toFixed(2);

          let zCell = document.createElement("td");
          zCell.textContent = point.z.toFixed(2);

          let distanceCell = document.createElement("td");
          distanceCell.textContent = point.distance.toFixed(2);

          row.appendChild(angleCell);
          row.appendChild(xCell);
          row.appendChild(yCell);
          row.appendChild(zCell);
          row.appendChild(distanceCell);

          // LiDAR 데이터에는 raw_distance가 있을 수 있으므로 조건문으로 처리
          if (type === "lidar" && point.raw_distance !== undefined) {
            let rawDistanceCell = document.createElement("td");
            rawDistanceCell.textContent = point.raw_distance.toFixed(2); // raw_distance는 LiDAR 데이터에만 있음
            row.appendChild(rawDistanceCell);
          } else {
            // Cloud 데이터에서는 raw_distance 없이도 처리하므로 빈 셀을 추가하지 않음
            let rawDistanceCell = document.createElement("td");
            rawDistanceCell.textContent = "-"; // raw_distance가 없는 경우 표시할 값
            row.appendChild(rawDistanceCell);
          }

          infoBox.appendChild(row);
        });
      }
    </script>
  </body>
</html>
