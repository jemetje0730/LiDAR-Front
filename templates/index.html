<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 최신 데이터</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .charts-wrapper {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        width: 100%;
        margin-bottom: 40px;
      }
      .canvas-wrapper {
        position: relative;
        width: 45vw;
        max-width: 600px;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
      .info-box {
        width: 300px;
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        background: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th, td {
        border: 1px solid #ddd;
        padding: 6px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
    </style>
  </head>
  <body>
    <h2>LiDAR 최신 데이터</h2>
    <button id="zoom-reset-btn" onclick="resetZoom()">줌 초기화</button>

    <div class="container">
      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="lidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 LiDAR 포인트 정보</h3>
          <table>
            <thead>
              <tr><th>각도(°)</th><th>X</th><th>Y</th><th>Z</th><th>거리(m)</th></tr>
            </thead>
            <tbody id="lidar-point-info"></tbody>
          </table>
        </div>
      </div>

      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="cloudLidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 Cloud 포인트 정보</h3>
          <table>
            <thead>
              <tr><th>각도(°)</th><th>X</th><th>Y</th><th>Z</th><th>거리(m)</th></tr>
            </thead>
            <tbody id="cloud-point-info"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("lidarChart").getContext("2d");
      const cloudCtx = document.getElementById("cloudLidarChart").getContext("2d");

      const chart = new Chart(ctx, createChartConfig("blue"));
      const cloudChart = new Chart(cloudCtx, createChartConfig("red"));

      let cloudSocket;
      let lastCloudData = [];

      function createChartConfig(color) {
        return {
          type: "scatter",
          data: { datasets: [{ label: "LiDAR Points", data: [], borderColor: color, backgroundColor: `${color}80`, pointRadius: 2 }] },
          options: {
            maintainAspectRatio: false,
            responsive: true,
            aspectRatio: 1,
            scales: { x: createAxis(), y: createAxis() },
            plugins: { zoom: { pan: { enabled: true, mode: "xy" }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: "xy" } } }
          }
        };
      }

      function createAxis() {
        return {
          min: -25,
          max: 25,
          grid: { color: (ctx) => (ctx.tick.value === 0 ? "black" : "gray"), lineWidth: (ctx) => (ctx.tick.value === 0 ? 2 : 0.5) }
        };
      }

      async function fetchLidarData() {
        try {
          const response = await fetch("http://127.0.0.1:8000/lidar_data");
          if (!response.ok) return console.warn("❌ LiDAR 데이터 없음");
          const data = await response.json();
          updateChart(chart, data.latest_lidar_xyz_points || []);
          updatePointInfo(data.latest_lidar_xyz_points || [], "lidar");
        } catch (error) {
          console.error("⚠️ LiDAR 데이터 가져오기 실패:", error);
        }
      }

      function connectWebSocket() {
        if (cloudSocket && cloudSocket.readyState === WebSocket.OPEN) return console.log("✅ WebSocket이 이미 연결됨");

        cloudSocket = new WebSocket("ws://127.0.0.1:8000/ws/cloud_point");

        cloudSocket.onopen = () => console.log("✅ WebSocket 연결 성공");
        cloudSocket.onmessage = (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.latest_cloud_point_xyz_points?.length > 0) updateCloudChart(data.latest_cloud_point_xyz_points);
          } catch (error) {
            console.error("❌ JSON 파싱 오류:", error);
          }
        };
        cloudSocket.onclose = () => {
          console.warn("❌ WebSocket 연결 종료. 5초 후 재연결...");
          setTimeout(connectWebSocket, 5000);
        };
        cloudSocket.onerror = (error) => console.error("⚠️ WebSocket 오류:", error);
      }

      function updateCloudChart(points) {
        if (JSON.stringify(lastCloudData) === JSON.stringify(points)) return;
        lastCloudData = points;
        updateChart(cloudChart, points);
        updatePointInfo(points, "cloud");
      }

      function updateChart(chartInstance, points) {
        chartInstance.data.datasets[0].data = points.map((p) => ({ x: p.x, y: p.y }));
        chartInstance.update();
      }

      function resetZoom() {
        chart.resetZoom();
        cloudChart.resetZoom();
      }

      function updatePointInfo(points, type) {
        const infoBoxId = type === "lidar" ? "lidar-point-info" : "cloud-point-info";
        const infoBox = document.getElementById(infoBoxId);
        infoBox.innerHTML = points
          .map((p, i) => `<tr><td>${(i * 0.25).toFixed(2)}°</td><td>${p.x.toFixed(2)}</td><td>${p.y.toFixed(2)}</td><td>${p.z.toFixed(2)}</td><td>${p.distance.toFixed(2)}</td></tr>`)
          .join("");
      }

      window.onload = function () {
        console.log("🔄 WebSocket 및 LiDAR 데이터 시작");
        connectWebSocket();
        setInterval(fetchLidarData, 5000);
      };
    </script>
  </body>
</html>
