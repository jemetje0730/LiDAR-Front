<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LiDAR 3D Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      /* 사이드바 스타일 */
      #sidebar {
        position: absolute;
        left: -300px; /* 기본적으로 숨김 */
        top: 0;
        width: 280px;
        height: 95%;
        background: rgba(0, 0, 0, 0.9);
        padding: 15px;
        transition: left 0.3s ease-in-out;
        color: white;
        overflow-y: auto;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
      }
      #sidebar.show {
        left: 0;
      }
      #menu-btn {
        position: absolute;
        top: 10px;
        left: 40px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #close-btn {
        display: block;
        margin-top: 15px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #reset-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #info-box {
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        max-height: 300px;
        overflow-y: auto;
        color: black;
      }
      #distance-table {
        width: 100%;
        border-collapse: collapse;
      }
      #distance-table td {
        border: 1px solid #ddd;
        padding: 5px;
        min-width: 40px;
        text-align: center;
        white-space: nowrap; /* 줄바꿈 방지 */
      }
    </style>
  </head>

  <body>
    <button id="menu-btn">☰</button>
    <button id="reset-btn">줌 초기화</button>

    <!-- 사이드바 -->
    <div id="sidebar">
      <h3>📌 LiDAR 설정</h3>
      <button id="close-btn">닫기</button>

      <h3>📌 LiDAR 거리 데이터</h3>
      <div id="info-box">
        <table id="distance-table">
          <tr>
            <th>#</th>
            <th>각도</th>
            <th>채널 1</th>
            <th>채널 2</th>
            <th>채널 3</th>
            <th>채널 4</th>
          </tr>
        </table>
      </div>

      <h3>📌 사용자 영역 설정</h3>
      <!-- 사용자 영역 설정 버튼 추가 -->
      <button
        id="selectAreaBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.9);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        사용자 영역 설정
      </button>

      <!-- 사용자 영역 선택 완료 버튼 -->
      <button
        id="finishSelectBtn"
        style="
          display: none;
          width: 100%;
          padding: 8px 15px;
          background: rgba(0, 123, 255, 0.9);
          color: white;
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        설정 완료
      </button>

      <button
        id="resetAreaBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 100, 100, 0.9);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        사용자 영역 초기화
      </button>

      <h3>📌 GetConfig</h3>
      <button
        id="outputChannelBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Output Channel
      </button>

      <!-- Output Channel 옵션 -->
      <div
        id="outputChannelOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH1" checked /> CH1
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH2" checked /> CH2
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH3" checked /> CH3
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="checkbox" name="outputChannel" value="CH4" checked /> CH4
        </label>
        <button
          id="setOutputChannel"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>

      <!-- Self Check Active State 버튼 -->
      <button
        id="selfCheckBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Self Check Active State
      </button>

      <!-- Low / High 옵션 창 -->
      <div
        id="selfCheckOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label style="color: black; display: block; padding: 5px 0">
          <input type="radio" name="selfCheck" value="Low" /> Low
        </label>
        <label style="color: black; display: block; padding: 5px 0">
          <input type="radio" name="selfCheck" value="High" checked /> High
        </label>
        <button
          id="setSelfCheck"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
      <button
        id="pulseDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Pulse Data
      </button>

      <!-- Pulse Data 설정 옵션 -->
      <div
        id="pulseDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="pulseDataValue"
          style="color: black; display: block; padding: 5px 0"
          >Pulse Value (0-1000ms):</label
        >
        <input
          type="range"
          id="pulseDataValue"
          min="0"
          max="1000"
          step="100"
          value="0"
          style="width: 100%"
        />
        <span
          id="pulseDataValueLabel"
          style="display: block; text-align: center"
          >0</span
        >

        <button
          id="setPulseData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>

      <button
        id="angleDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Angle Data
      </button>

      <!-- Angle Data 설정 옵션 -->
      <div
        id="angleDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="minAngleValue"
          style="color: black; display: block; padding: 5px 0"
          >Min Angle (0-100°):</label
        >
        <input
          type="range"
          id="minAngleValue"
          min="0"
          max="100"
          step="1"
          value="0"
          style="width: 100%"
        />
        <span id="minAngleValueLabel" style="display: block; text-align: center"
          >0°</span
        >

        <label
          for="maxAngleValue"
          style="color: black; display: block; padding: 5px 0"
          >Max Angle (0-100°):</label
        >
        <input
          type="range"
          id="maxAngleValue"
          min="0"
          max="100"
          step="1"
          value="100"
          style="width: 100%"
        />
        <span id="maxAngleValueLabel" style="display: block; text-align: center"
          >100°</span
        >
        <button
          id="setAngleData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
      <button
        id="distanceRangeBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Distance Range
      </button>

      <!-- Distance Range 설정 옵션 -->
      <div
        id="distanceRangeOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="minDistance"
          style="color: black; display: block; padding: 5px 0"
          >Min Distance (0-49m):</label
        >
        <input
          type="range"
          id="minDistance"
          min="0"
          max="49"
          value="0"
          step="1"
          style="width: 100%"
        />
        <span id="minDistanceLabel" style="display: block; text-align: center"
          >0m</span
        >

        <label
          for="maxDistance"
          style="color: black; display: block; padding: 5px 0"
          >Max Distance (1-50m):</label
        >
        <input
          type="range"
          id="maxDistance"
          min="1"
          max="50"
          value="50"
          step="1"
          style="width: 100%"
        />
        <span id="maxDistanceLabel" style="display: block; text-align: center"
          >50m</span
        >

        <button
          id="setDistanceRange"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>

      <button
        id="areaDataBtn"
        style="
          display: block;
          width: 100%;
          padding: 8px 15px;
          background: rgba(255, 255, 255, 0.8);
          border: none;
          border-radius: 5px;
          font-size: 14px;
          cursor: pointer;
          margin-top: 5px;
        "
      >
        Area Data
      </button>

      <!-- Area Data 설정 옵션 -->
      <div
        id="areaDataOptions"
        style="
          display: none;
          background: rgba(255, 255, 255, 0.8);
          padding: 10px;
          border-radius: 5px;
          margin-top: 5px;
        "
      >
        <label
          for="areaDataValue"
          style="color: black; display: block; padding: 5px 0"
          >Area Size (0-255cm):</label
        >
        <input
          type="range"
          id="areaDataValue"
          min="0"
          max="255"
          step="1"
          value="0"
          style="width: 100%"
        />
        <span id="areaDataValueLabel" style="display: block; text-align: center"
          >0cm</span
        >

        <button
          id="setAreaData"
          style="
            width: 100%;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
          "
        >
          설정
        </button>
      </div>
    </div>

    <script>
      // 사이드바 토글 기능
      const menuBtn = document.getElementById("menu-btn");
      const sidebar = document.getElementById("sidebar");
      const closeBtn = document.getElementById("close-btn");

      menuBtn.addEventListener("click", () => {
        sidebar.classList.toggle("show");
      });

      closeBtn.addEventListener("click", () => {
        sidebar.classList.remove("show");
      });

      window.addEventListener("load", () => {
        const savedVertices = JSON.parse(
          localStorage.getItem("selectedVertices")
        );
        const savedClickedDots = JSON.parse(
          localStorage.getItem("clickedDots")
        );

        if (savedVertices && savedVertices.length >= 3) {
          selectedVertices = savedVertices;

          // 폴리곤 선 복원
          const geometry = new THREE.BufferGeometry().setFromPoints([
            ...selectedVertices,
            selectedVertices[0],
          ]);
          const material = new THREE.LineBasicMaterial({ color: 0xffffff });
          areaLine = new THREE.Line(geometry, material);
          scene.add(areaLine);
        }

        if (savedClickedDots) {
          savedClickedDots.forEach((pt) => {
            const geo = new THREE.SphereGeometry(0.05, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: pt.color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(pt.x, pt.y, 0);
            scene.add(mesh);
            areaDots.push(mesh);
            clickedDots.push(pt);
          });
        }
      });

      let selectingArea = false;
      let selectedVertices = [];
      let areaLine = null;
      let clickedDots = [];
      let areaDots = [];
      let lastLidarData = null;

      document.addEventListener("DOMContentLoaded", () => {
        // [1] 토글 기능 공통 함수
        function toggleOptions(buttonId, optionsId) {
          document.getElementById(buttonId).addEventListener("click", () => {
            const options = document.getElementById(optionsId);
            options.style.display =
              options.style.display === "none" ? "block" : "none";
          });
        }

        // [2] 범위 값 업데이트 함수
        function updateRangeValue(inputId, labelId, unit = "") {
          document
            .getElementById(inputId)
            .addEventListener("input", (event) => {
              document.getElementById(labelId).innerText =
                event.target.value + unit;
            });
        }

        // [3] 서버 요청 함수
        function sendData(url, data, successMessage) {
          fetch(`http://127.0.0.1:8000/${url}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          })
            .then((response) => response.json())
            .then((res) => {
              console.log(successMessage, res);
              alert(`✅ ${successMessage}`);
            })
            .catch((error) => {
              console.error("❌ 설정 오류:", error);
              alert("❌ 설정 실패!");
            });
        }

        // [4] setAreaData 버튼 클릭 시 동작 추가
        document.getElementById("setAreaData").addEventListener("click", () => {
          const areaData = parseInt(
            document.getElementById("areaDataValue").value
          );
          localStorage.setItem("areaData", areaData);
          sendData(
            "set_area_data",
            { area_data: areaData },
            "Area Data 설정 완료!"
          );
        });

        // 토글 버튼 적용
        toggleOptions("areaDataBtn", "areaDataOptions");
        toggleOptions("distanceRangeBtn", "distanceRangeOptions");
        toggleOptions("pulseDataBtn", "pulseDataOptions");
        toggleOptions("angleDataBtn", "angleDataOptions");
        toggleOptions("outputChannelBtn", "outputChannelOptions");
        toggleOptions("selfCheckBtn", "selfCheckOptions");

        // 범위 값 업데이트 적용
        updateRangeValue("areaDataValue", "areaDataValueLabel", "cm");
        updateRangeValue("maxDistance", "maxDistanceLabel", "m");
        updateRangeValue("minDistance", "minDistanceLabel", "m");
        updateRangeValue("pulseDataValue", "pulseDataValueLabel");
        updateRangeValue("minAngleValue", "minAngleValueLabel", "°");
        updateRangeValue("maxAngleValue", "maxAngleValueLabel", "°");

        // selectAreaBtn을 눌러서 영역 선택 시작
        // selectAreaBtn을 눌러서 영역 선택 시작
        document
          .getElementById("selectAreaBtn")
          .addEventListener("click", () => {
            selectingArea = true;
            selectedVertices = [];
            if (areaLine) {
              scene.remove(areaLine);
              areaLine.geometry.dispose();
              areaLine.material.dispose();
              areaLine = null;
            }
            document.getElementById("finishSelectBtn").style.display = "inline";
          });

        // finishSelectBtn을 눌러서 폴리곤 생성
        document
          .getElementById("finishSelectBtn")
          .addEventListener("click", () => {
            selectingArea = false;
            document.getElementById("finishSelectBtn").style.display = "none";

            if (selectedVertices.length < 3) {
              alert("❌ 최소 3개 이상의 포인트를 선택하세요.");
              return;
            }

            // Polygon 그리기 (흰색 선)
            const geometry = new THREE.BufferGeometry().setFromPoints([
              ...selectedVertices,
              selectedVertices[0], // 첫 번째 점으로 돌아가서 닫는 폴리곤
            ]);
            const material = new THREE.LineBasicMaterial({ color: 0xffffff });
            areaLine = new THREE.Line(geometry, material);
            scene.add(areaLine);

            checkPointsInsidePolygon(); // 내부 포인트 검사 및 색상 결정
            // 로컬 스토리지에 저장
            localStorage.setItem(
              "selectedVertices",
              JSON.stringify(selectedVertices)
            );
          });

        const dotGeometry = new THREE.SphereGeometry(0.05, 16, 16);
        const dotMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

        renderer.domElement.addEventListener("click", (event) => {
          if (!selectingArea) return;

          const mouse = new THREE.Vector2(
            (event.clientX / window.innerWidth) * 2 - 1,
            -(event.clientY / window.innerHeight) * 2 + 1
          );

          const raycaster = new THREE.Raycaster();
          raycaster.setFromCamera(mouse, camera);

          const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
          const point = new THREE.Vector3();
          raycaster.ray.intersectPlane(plane, point);

          if (point) {
            selectedVertices.push(point.clone());

            const dot = new THREE.Mesh(dotGeometry, dotMaterial.clone());
            dot.position.copy(point);
            scene.add(dot);
            areaDots.push(dot);

            const dotInfo = { x: point.x, y: point.y, color: 0xffffff };
            clickedDots.push(dotInfo);

            // 저장
            localStorage.setItem(
              "selectedVertices",
              JSON.stringify(selectedVertices)
            );
            localStorage.setItem("clickedDots", JSON.stringify(clickedDots));
          }
        });

        // resetAreaBtn을 눌렀을 때 초기화
        document
          .getElementById("resetAreaBtn")
          .addEventListener("click", () => {
            areaDots.forEach((dot) => {
              scene.remove(dot);
              dot.geometry.dispose();
              dot.material.dispose();
            });
            areaDots = [];

            if (areaLine) {
              scene.remove(areaLine);
              areaLine.geometry.dispose();
              areaLine.material.dispose();
              areaLine = null;
            }

            selectedVertices = [];
            clickedDots = [];
            selectingArea = false;

            localStorage.removeItem("selectedVertices");
            localStorage.removeItem("clickedDots");

            document.getElementById("finishSelectBtn").style.display = "none";
          });

        let minDistanceLimit = 0;
        let maxDistanceLimit = 50;

        document
          .getElementById("setDistanceRange")
          .addEventListener("click", () => {
            const minDistance = parseInt(
              document.getElementById("minDistance").value
            );
            const maxDistance = parseInt(
              document.getElementById("maxDistance").value
            );

            if (
              isNaN(minDistance) ||
              isNaN(maxDistance) ||
              minDistance < 0 ||
              maxDistance > 50 ||
              minDistance >= maxDistance
            ) {
              alert("❌ 유효한 거리 범위를 입력하세요! (0~50m, min < max)");
              return;
            }

            minDistanceLimit = minDistance;
            maxDistanceLimit = maxDistance;

            // 👉 최신 데이터를 기반으로 그래프 다시 그리기
            if (lastLidarData) {
              updatePointCloud(lastLidarData, 4);
            }

            sendData(
              "set_distance_range",
              { min_distance: minDistance, max_distance: maxDistance },
              "Distance Range 설정 완료!"
            );
          });

        document
          .getElementById("setPulseData")
          .addEventListener("click", () => {
            sendData(
              "set_pulse_data",
              {
                value: parseInt(
                  document.getElementById("pulseDataValue").value
                ),
              },
              "Pulse Data 설정 완료!"
            );
          });

        document
          .getElementById("setAngleData")
          .addEventListener("click", () => {
            const minAngle = parseInt(
              document.getElementById("minAngleValue").value
            );
            const maxAngle = parseInt(
              document.getElementById("maxAngleValue").value
            );

            if (minAngle > maxAngle) {
              alert("❌ Min Angle은 Max Angle보다 클 수 없습니다.");
              return;
            }
            sendData(
              "set_angle_data",
              { min_angle: minAngle, max_angle: maxAngle },
              "Angle Data 설정 완료!"
            );
          });

        document
          .getElementById("setOutputChannel")
          .addEventListener("click", () => {
            const selectedChannels = Array.from(
              document.querySelectorAll("input[name='outputChannel']:checked")
            ).map((el) => parseInt(el.value.replace("CH", "")) - 1);

            if (selectedChannels.length === 0) {
              alert("❌ 최소 하나의 채널을 선택하세요.");
              return;
            }

            // activeChannels 업데이트 (선택한 채널만 저장)
            activeChannels = new Set(selectedChannels);

            let outputChannelData = 0;
            selectedChannels.forEach((channel) => {
              outputChannelData |= 1 << channel;
            });

            sendData(
              "set_output_channel",
              { output_channel: outputChannelData },
              "Output Channel 설정 완료!"
            );

            console.log("✅ 활성화된 채널:", activeChannels);
          });

        document
          .getElementById("setSelfCheck")
          .addEventListener("click", () => {
            const selectedOption = document.querySelector(
              "input[name='selfCheck']:checked"
            );

            if (!selectedOption) {
              alert("❌ 옵션을 선택하세요.");
              return;
            }

            sendData(
              "set_self_check",
              { state: selectedOption.value },
              "Self Check Active State 설정 완료!"
            );
          });
      });
    </script>

    <script>
      // 초기 카메라 위치 저장
      const initialCameraPosition = new THREE.Vector3(0, 0, 20);
      const initialTarget = new THREE.Vector3(0, 0, 0);

      // 초기화 버튼 클릭 이벤트
      document.getElementById("reset-btn").addEventListener("click", () => {
        camera.position.copy(initialCameraPosition);
        controls.target.copy(initialTarget);
        controls.update();
      });
    </script>

    <script>
      // window.onload: 기존 설정 불러오기
      window.onload = function () {
        // Output Channel 설정 복원
        const savedChannels = JSON.parse(
          localStorage.getItem("selectedChannels")
        ) || [0, 1, 2, 3];
        document
          .querySelectorAll("input[name='outputChannel']")
          .forEach((checkbox, index) => {
            checkbox.checked = savedChannels.includes(index);
          });
        activeChannels = new Set(savedChannels);

        // Self Check 설정 복원
        const savedSelfCheck = localStorage.getItem("selfCheckState") || "low";
        document
          .querySelectorAll("input[name='selfCheck']")
          .forEach((radio) => {
            if (radio.value === savedSelfCheck) {
              radio.checked = true;
            }
          });

        // Area Data 값 복원
        const savedAreaData = localStorage.getItem("areaData") || "10"; // 기본값 10cm
        document.getElementById("areaDataValue").value = savedAreaData;
        document.getElementById("areaDataValueLabel").innerText =
          savedAreaData + "cm";

        // 거리 범위 설정 복원
        document.getElementById("minDistance").value =
          localStorage.getItem("minDistance") || 0;
        document.getElementById("maxDistance").value =
          localStorage.getItem("maxDistance") || 50;
        document.getElementById("minDistanceLabel").innerText =
          document.getElementById("minDistance").value + "m";
        document.getElementById("maxDistanceLabel").innerText =
          document.getElementById("maxDistance").value + "m";

        // Pulse Data 설정 복원
        document.getElementById("pulseDataValue").value =
          localStorage.getItem("pulseData") || 0;
        document.getElementById("pulseDataValueLabel").innerText =
          document.getElementById("pulseDataValue").value;

        // Angle 설정 복원
        document.getElementById("minAngleValue").value =
          localStorage.getItem("minAngle") || 0;
        document.getElementById("maxAngleValue").value =
          localStorage.getItem("maxAngle") || 180;
        document.getElementById("minAngleValueLabel").innerText =
          document.getElementById("minAngleValue").value + "°";
        document.getElementById("maxAngleValueLabel").innerText =
          document.getElementById("maxAngleValue").value + "°";

        console.log("🔄 기존 설정 적용 완료!", {
          savedChannels,
          savedSelfCheck,
          savedAreaData,
        });
      };

      function isVertexInViewAngle(vertex, minAngle, maxAngle) {
        const dx = vertex.x - camera.position.x;
        const dy = vertex.y - camera.position.y;

        let angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        if (angleDeg < 0) angleDeg += 360;

        minAngle = (minAngle + 360) % 360;
        maxAngle = (maxAngle + 360) % 360;

        if (minAngle <= maxAngle) {
          return angleDeg >= minAngle && angleDeg <= maxAngle;
        } else {
          // 예: 350 ~ 10 도 같은 경우
          return angleDeg >= minAngle || angleDeg <= maxAngle;
        }
      }

      // 설정 변경 시 저장하는 함수
      function saveSettings() {
        const selectedChannels = [];
        document
          .querySelectorAll("input[name='outputChannel']")
          .forEach((checkbox, index) => {
            if (checkbox.checked) {
              selectedChannels.push(index);
            }
          });

        localStorage.setItem(
          "selectedChannels",
          JSON.stringify(selectedChannels)
        );
        localStorage.setItem(
          "minDistance",
          document.getElementById("minDistance").value
        );
        localStorage.setItem(
          "maxDistance",
          document.getElementById("maxDistance").value
        );
        localStorage.setItem(
          "pulseData",
          document.getElementById("pulseDataValue").value
        );
        localStorage.setItem(
          "minAngle",
          document.getElementById("minAngleValue").value
        );
        localStorage.setItem(
          "maxAngle",
          document.getElementById("maxAngleValue").value
        );

        console.log("💾 설정 저장 완료!", { selectedChannels });
      }

      // Self Check 변경 시 저장
      document.querySelectorAll("input[name='selfCheck']").forEach((radio) => {
        radio.addEventListener("change", function () {
          localStorage.setItem("selfCheckState", this.value);
          console.log("💾 Self Check 상태 저장:", this.value);
        });
      });

      document.getElementById("setSelfCheck").addEventListener("click", () => {
        const selectedOption = document.querySelector(
          "input[name='selfCheck']:checked"
        );

        if (!selectedOption) {
          alert("❌ 옵션을 선택하세요.");
          return;
        }

        localStorage.setItem("selfCheckState", selectedOption.value);
        sendData(
          "set_self_check",
          { state: selectedOption.value },
          "Self Check Active State 설정 완료!"
        );
      });

      // Area Data 변경 시 저장
      document
        .getElementById("areaDataValue")
        .addEventListener("input", function () {
          localStorage.setItem("areaData", this.value);
          document.getElementById("areaDataValueLabel").innerText =
            this.value + "cm";
          console.log("💾 Area Data 저장:", this.value);
        });

      // 모든 입력 요소에 이벤트 추가 → 변경될 때 자동 저장
      document
        .querySelectorAll("input[name='outputChannel']")
        .forEach((checkbox) => {
          checkbox.addEventListener("change", saveSettings);
        });

      document
        .getElementById("minDistance")
        .addEventListener("input", saveSettings);
      document
        .getElementById("maxDistance")
        .addEventListener("input", saveSettings);
      document
        .getElementById("pulseDataValue")
        .addEventListener("input", saveSettings);
      document
        .getElementById("minAngleValue")
        .addEventListener("input", saveSettings);
      document
        .getElementById("maxAngleValue")
        .addEventListener("input", saveSettings);
    </script>

    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.enablePan = true;

      const axesHelper = new THREE.AxesHelper(1);
      axesHelper.renderOrder = 1;
      axesHelper.material.depthTest = false;
      scene.add(axesHelper);

      camera.position.set(0, 0, 20);
      camera.lookAt(0, 0, 0);
      controls.update();

      const distanceLabels = [];
      function createDistanceCirclesWithLabels() {
        for (let i = 1; i <= 20; i++) {
          const points = [];
          for (let j = 0; j <= 64; j++) {
            const angle = (j / 64) * Math.PI * 2;
            points.push(
              new THREE.Vector3(Math.cos(angle) * i, Math.sin(angle) * i, 0)
            );
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({ color: 0x444444 });
          const circle = new THREE.LineLoop(geometry, material);
          scene.add(circle);

          const label = document.createElement("div");
          label.className = "distance-label";
          label.innerText = `${i}m`;
          document.body.appendChild(label);
          distanceLabels.push({ element: label, distance: i });
        }
      }

      function updateDistanceLabels() {
        const minDistance = parseInt(
          document.getElementById("minDistance").value
        );
        const maxDistance = parseInt(
          document.getElementById("maxDistance").value
        );

        // ✅ 실제 필터값으로 반영되게 변수에 저장!
        minDistanceLimit = minDistance;
        maxDistanceLimit = maxDistance;

        document.getElementById("minDistanceLabel").innerText =
          minDistance + "m";
        document.getElementById("maxDistanceLabel").innerText =
          maxDistance + "m";
      }

      function createGrid(size) {
        const gridHelper = new THREE.GridHelper(
          size * 2,
          size * 2,
          0x333333,
          0x333333
        );
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
      }

      createDistanceCirclesWithLabels();
      createGrid(20);

      let pointClouds = {};
      const channelColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffa500];
      const verticalAngles = [-1.07, 0, 1.07, 2];

      function initPointClouds(channelCount) {
        for (let i = 0; i < channelCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const material = new THREE.PointsMaterial({
            color: channelColors[i % 4],
            size: 0.05, // 포인트 크기 조정
            transparent: true,
            opacity: 0.9,
          });

          pointClouds[i] = new THREE.Points(geometry, material);
          scene.add(pointClouds[i]);

          console.log(`✅ 채널 ${i} 포인트 클라우드 추가됨`); // 추가 확인 로그
        }
      }

      function drawClickedPoints(points) {
        areaDots.forEach((dot) => {
          scene.remove(dot);
          dot.geometry.dispose();
          dot.material.dispose();
        });
        areaDots = [];

        points.forEach((pt) => {
          const geo = new THREE.SphereGeometry(0.05, 8, 8);
          const mat = new THREE.MeshBasicMaterial({ color: pt.color });
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(pt.x, pt.y, 0);
          scene.add(mesh);
          areaDots.push(mesh);
        });
      }

      function isPointInsidePolygon(x, y, polygon) {
        let inside = false;
        for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
          const xi = polygon[i][0],
            yi = polygon[i][1];
          const xj = polygon[j][0],
            yj = polygon[j][1];

          const intersect =
            yi > y !== yj > y &&
            x < ((xj - xi) * (y - yi)) / (yj - yi + 0.00001) + xi;
          if (intersect) inside = !inside;
        }
        return inside;
      }

      // 폴리곤 내부의 점들이 색상에 맞게 그려집니다.
      function checkPointsInsidePolygon() {
        if (!selectedVertices || selectedVertices.length < 3 || !lastLidarData)
          return;

        const polygon = selectedVertices.map((v) => [v.x, v.y]);
        const areaSize = parseInt(
          document.getElementById("areaDataValue").value
        );
        const lidarPoints = [];

        Object.values(lastLidarData).forEach((channelPoints) => {
          if (Array.isArray(channelPoints)) {
            lidarPoints.push(...channelPoints);
          }
        });

        const insidePoints = [];

        for (const point of lidarPoints) {
          const { x, y, distance } = point;

          if (isPointInsidePolygon(x, y, polygon)) {
            const color = distance >= areaSize ? 0x0000ff : 0xffffff;
            insidePoints.push({ x, y, color });
          }
        }

        // 이 부분은 색상만 지정하여 그리기 위한 것
        drawCheckedPoints(insidePoints);
      }

      document.addEventListener("DOMContentLoaded", () => {
        // 모든 Output Channel 체크박스를 자동 체크
        document
          .querySelectorAll("input[name='outputChannel']")
          .forEach((checkbox) => {
            checkbox.checked = true;
          });

        console.log("✅ 초기 설정: 모든 채널 활성화됨");
      });

      let minDistanceLimit = 0;
      let maxDistanceLimit = 50;

      let ws = new WebSocket("ws://127.0.0.1:8000/ws/lidar");

      let activeChannels = new Set([0, 1, 2, 3]);

      // `ws.onmessage`에서 라이다 데이터 처리 (점 그리지 않음, 색상만 업데이트)
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        lastLidarData = data.lidar_data;

        // 기존 포인트 클라우드 처리
        if (data.lidar_data && data.distances) {
          updatePointCloud(lastLidarData, 4);
          updateDistanceTable(data.distances);
        }

        // 폴리곤 감지
        if (selectedVertices.length >= 3 && areaLine) {
          const polygon = selectedVertices.map((v) => [v.x, v.y]);
          const areaSize = parseInt(
            document.getElementById("areaDataValue").value
          );
          let isDetected = false;

          Object.values(lastLidarData).forEach((channelPoints) => {
            if (Array.isArray(channelPoints)) {
              for (const point of channelPoints) {
                if (
                  isPointInsidePolygon(point.x, point.y, polygon) &&
                  point.distance >= areaSize
                ) {
                  isDetected = true;
                  break;
                }
              }
            }
            if (isDetected) return;
          });

          // 선 색상만 업데이트
          areaLine.material.color.set(isDetected ? 0x0000ff : 0xffffff);
        }
      };

      function updatePointCloud(lidarData, channelCount) {
        if (!lidarData) return;

        const angleOffset = Math.PI / 4 - Math.PI / 36;

        for (let i = 0; i < channelCount; i++) {
          if (!activeChannels.has(i)) {
            pointClouds[i].geometry.dispose();
            pointClouds[i].geometry = new THREE.BufferGeometry();
            continue;
          }

          if (lidarData[i] && lidarData[i].length > 0) {
            const points = lidarData[i].map((p) => {
              const x =
                p.x * Math.cos(angleOffset) - p.y * Math.sin(angleOffset);
              const y =
                p.x * Math.sin(angleOffset) + p.y * Math.cos(angleOffset);
              return new THREE.Vector3(x, y, p.z);
            });

            if (pointClouds[i].geometry) {
              pointClouds[i].geometry.dispose();
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            pointClouds[i].geometry = geometry;
          }
        }
      }

      function updateDistanceTable(distances) {
        let table = document.getElementById("distance-table");
        let html = `<tr>
          <th>#</th>
          <th>각도</th>
          <th>채널 1</th>
          <th>채널 2</th>
          <th>채널 3</th>
          <th>채널 4</th>
      </tr>`;

        for (let i = 0; i < 400; i++) {
          // 각도 400개 기준으로 업데이트
          const angle = (i * 0.25).toFixed(2);

          // 거리 값 처리 (최대 50m 제한 & 소수 둘째 자리까지 표시)
          const formatDistance = (d) =>
            d !== undefined ? Math.min(50, parseFloat(d)).toFixed(2) : "-";

          const dist0 = formatDistance(distances[0]?.[i]?.distance);
          const dist1 = formatDistance(distances[1]?.[i]?.distance);
          const dist2 = formatDistance(distances[2]?.[i]?.distance);
          const dist3 = formatDistance(distances[3]?.[i]?.distance);

          html += `<tr>
          <td>${i}</td>
          <td>${angle}</td>
          <td>${dist0}</td>
          <td>${dist1}</td>
          <td>${dist2}</td>
          <td>${dist3}</td>
      </tr>`;
        }
        table.innerHTML = html;
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        updateDistanceLabels();
      }
      animate();
      initPointClouds(4);
    </script>
  </body>
</html>
