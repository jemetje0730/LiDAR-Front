<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiDAR 최신 데이터</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
    <style>
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .charts-wrapper {
        display: flex;
        justify-content: space-around;
        gap: 20px;
        width: 100%;
        margin-bottom: 40px;
      }
      .canvas-wrapper {
        position: relative;
        width: 45vw;
        max-width: 600px;
      }
      .canvas-wrapper::before {
        content: "";
        display: block;
        padding-top: 100%;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .info-box-wrapper {
        display: flex;
        justify-content: space-between;
        width: 90%;
      }
      .info-box {
        width: 300px;
        height: 400px;
        overflow-y: auto;
        border: 1px solid #ccc;
        padding: 10px;
        background: #f9f9f9;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 6px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }

      /* Hide buttons initially */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h2>LiDAR 최신 데이터</h2>
    <button id="lidar-data-btn" class="hidden" onclick="fetchLidarData()">
      최신 LiDAR 데이터 가져오기
    </button>
    <button id="cloud-data-btn" class="hidden" onclick="fetchCloudPointData()">
      클라우드 포인트 데이터 가져오기
    </button>
    <button id="zoom-reset-btn" class="hidden" onclick="resetZoom()">
      줌 초기화
    </button>

    <div class="container">
      <h2>LiDAR 데이터 수신</h2>
      <label for="ip-input">IP 주소:</label>
      <input type="text" id="ip-input" placeholder="예: 192.168.123.100" />
      <label for="port-input">포트 번호:</label>
      <input type="number" id="port-input" placeholder="예: 5000" />
      <button onclick="connectToDevice()">연결</button>

      <div id="status-message"></div>
    </div>

    <div class="container" id="charts-container" style="display: none">
      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="lidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 LiDAR 포인트 정보</h3>
          <table>
            <thead>
              <tr>
                <th>각도(°)</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>거리(m)</th>
              </tr>
            </thead>
            <tbody id="lidar-point-info"></tbody>
          </table>
        </div>
      </div>

      <div class="charts-wrapper">
        <div class="canvas-wrapper">
          <canvas id="cloudLidarChart"></canvas>
        </div>
        <div class="info-box">
          <h3>📌 Cloud 포인트 정보</h3>
          <table>
            <thead>
              <tr>
                <th>각도(°)</th>
                <th>X</th>
                <th>Y</th>
                <th>Z</th>
                <th>거리(m)</th>
              </tr>
            </thead>
            <tbody id="cloud-point-info"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      const ctx = document.getElementById("lidarChart").getContext("2d");
      const cloudCtx = document
        .getElementById("cloudLidarChart")
        .getContext("2d");

      const chart = new Chart(ctx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "LiDAR Points (UDP)",
              data: [],
              borderColor: "blue",
              backgroundColor: "rgba(0, 0, 255, 0.5)",
              pointRadius: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: true,
          responsive: true,
          aspectRatio: 1,
          layout: { padding: 0 },
          scales: {
            x: {
              min: -25,
              max: 25,
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
            y: {
              min: -25,
              max: 25,
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
          },
          plugins: {
            legend: { display: true },
            zoom: {
              pan: { enabled: true, mode: "xy" },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: "xy",
              },
            },
          },
        },
      });

      const cloudChart = new Chart(cloudCtx, {
        type: "scatter",
        data: {
          datasets: [
            {
              label: "LiDAR Points (Cloud)",
              data: [],
              borderColor: "red",
              backgroundColor: "rgba(255, 0, 0, 0.5)",
              pointRadius: 2,
            },
          ],
        },
        options: {
          maintainAspectRatio: true,
          responsive: true,
          aspectRatio: 1,
          layout: { padding: 0 },
          scales: {
            x: {
              min: -25,
              max: 25,
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
            y: {
              min: -25,
              max: 25,
              grid: {
                color: (context) =>
                  context.tick.value === 0 ? "black" : "gray",
                lineWidth: (context) => (context.tick.value === 0 ? 2 : 0.5),
              },
            },
          },
          plugins: {
            legend: { display: true },
            zoom: {
              pan: { enabled: true, mode: "xy" },
              zoom: {
                wheel: { enabled: true },
                pinch: { enabled: true },
                mode: "xy",
              },
            },
          },
        },
      });

      window.onload = function () {};

      async function connectToDevice() {
        const ip = document.getElementById("ip-input").value;
        const port = document.getElementById("port-input").value;
        const statusMessage = document.getElementById("status-message");

        if (!ip || !port) {
          statusMessage.textContent = "IP 주소와 포트 번호를 입력해주세요.";
          return;
        }

        try {
          console.log(`연결 시도 중... IP: ${ip}, 포트: ${port}`);
          const response = await fetch(`http://${ip}:${port}/`, {
            method: "GET",
          });

          if (response.ok) {
            statusMessage.textContent = "연결 성공! LiDAR 데이터를 수신 중...";
            document.getElementById("charts-container").style.display = "block"; // UI 표시

            // ✅ 이미 실행 중이면 setInterval 중복 방지
            if (!window.isFetching) {
              window.isFetching = true;
              setInterval(fetchLidarData, 5000);
              setInterval(fetchCloudPointData, 5000);
            }
          } else {
            statusMessage.textContent =
              "연결 실패! 올바른 IP와 포트를 확인해주세요.";
            hideUI();
          }
        } catch (error) {
          statusMessage.textContent = `연결 실패: ${error.message}`;
          hideUI();
        }
      }

      function hideUI() {
        document.getElementById("charts-container").style.display = "none";
        window.isFetching = false; // 데이터 요청 중지 상태
      }

      async function fetchLidarData() {
        try {
          console.log("🔄 LiDAR 데이터 요청 중...");
          const response = await fetch("http://127.0.0.1:8000/lidar_data");
          console.log("📡 응답 상태 코드:", response.status);

          const data = await response.json();
          console.log("✅ 변환된 JSON 데이터:", data);

          if (data.latest_lidar_xyz_points) {
            let angle = 0.0;
            const angleStep = 0.25;
            const points = data.latest_lidar_xyz_points.map((p) => {
              return {
                x: p.x,
                y: p.y,
                z: p.z,
                distance: p.distance,
                angle: (angle += angleStep).toFixed(2),
              };
            });

            console.log("📡 변환된 LiDAR 포인트 데이터:", points.slice(0, 5));

            chart.data.datasets[0].data = points;
            chart.update();
            updatePointInfo(points, "lidar");
          } else {
            console.log("❌ 새로운 LiDAR 데이터가 없습니다.");
          }
        } catch (error) {
          console.error("⚠️ LiDAR 데이터 가져오기 실패:", error);
        }
      }

      async function fetchCloudPointData() {
        try {
          console.log("🔄 Cloud LiDAR 데이터 요청 중...");
          const response = await fetch(
            "http://127.0.0.1:8000/cloud_point_data"
          );
          console.log("📡 응답 상태 코드:", response.status);

          const data = await response.json();
          console.log("✅ 변환된 Cloud 데이터:", data);

          if (
            data.latest_cloud_point_xyz_points &&
            data.latest_cloud_point_xyz_points.length > 0
          ) {
            let angle = 0.0;
            const angleStep = 0.25;
            const cloudPoints = data.latest_cloud_point_xyz_points.map((p) => {
              return {
                x: p.x,
                y: p.y,
                z: p.z,
                distance: p.distance,
                angle: (angle += angleStep).toFixed(2),
              };
            });

            console.log(
              "📡 변환된 Cloud 포인트 데이터:",
              cloudPoints.slice(0, 5)
            );

            cloudChart.data.datasets[0].data = cloudPoints;
            cloudChart.update();
            updatePointInfo(cloudPoints, "cloud");
          } else {
            console.log("❌ 새로운 Cloud 포인트 데이터가 없습니다.");
          }
        } catch (error) {
          console.error("⚠️ Cloud LiDAR 데이터 가져오기 실패:", error);
        }
      }

      function resetZoom() {
        chart.resetZoom();
        cloudChart.resetZoom();
      }

      function updatePointInfo(points, type) {
        const infoBoxId =
          type === "lidar" ? "lidar-point-info" : "cloud-point-info";
        const infoBox = document.getElementById(infoBoxId);
        infoBox.innerHTML = "";

        points.forEach((point) => {
          let row = document.createElement("tr");

          let angleCell = document.createElement("td");
          angleCell.textContent = `${point.angle}°`;

          let xCell = document.createElement("td");
          xCell.textContent = point.x.toFixed(2);

          let yCell = document.createElement("td");
          yCell.textContent = point.y.toFixed(2);

          let zCell = document.createElement("td");
          zCell.textContent = point.z.toFixed(2);

          let distanceCell = document.createElement("td");
          distanceCell.textContent = point.distance.toFixed(2);

          row.appendChild(angleCell);
          row.appendChild(xCell);
          row.appendChild(yCell);
          row.appendChild(zCell);
          row.appendChild(distanceCell);
          infoBox.appendChild(row);
        });
      }
    </script>
  </body>
</html>
