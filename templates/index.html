<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>LiDAR 3D Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #reset-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 8px 15px;
        background: rgba(255, 255, 255, 0.8);
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
      }
      #info-box {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.8);
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        max-height: 300px;
        overflow-y: auto;
        color: black;
      }
      .distance-label {
        position: absolute;
        color: white;
        font-size: 12px;
        font-weight: bold;
        background: rgba(0, 0, 0, 0.6);
        padding: 2px 5px;
        border-radius: 3px;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>

  <body>
    <button id="reset-btn">줌 초기화</button>
    <div id="info-box">
      <h3>📌 LiDAR 거리 데이터</h3>
      <table id="distance-table" border="1" cellpadding="5">
        <tr>
          <th>#</th>
          <th>각도 (°)</th>
          <th>채널 0 (m)</th>
          <th>채널 1 (m)</th>
          <th>채널 2 (m)</th>
          <th>채널 3 (m)</th>
        </tr>
      </table>
    </div>

    <script>
      // 📌 초기 카메라 위치 저장
      const initialCameraPosition = new THREE.Vector3(0, 0, 20);
      const initialTarget = new THREE.Vector3(0, 0, 0);

      // 📌 초기화 버튼 클릭 이벤트
      document.getElementById("reset-btn").addEventListener("click", () => {
        camera.position.copy(initialCameraPosition);
        controls.target.copy(initialTarget);
        controls.update();
      });
    </script>

    <script>
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableZoom = true;
      controls.enablePan = true;

      const axesHelper = new THREE.AxesHelper(3);
      axesHelper.renderOrder = 1;
      axesHelper.material.depthTest = false;
      scene.add(axesHelper);

      camera.position.set(0, 0, 20);
      camera.lookAt(0, 0, 0);
      controls.update();

      const distanceLabels = [];
      function createDistanceCirclesWithLabels() {
        for (let i = 1; i <= 20; i++) {
          const points = [];
          for (let j = 0; j <= 64; j++) {
            const angle = (j / 64) * Math.PI * 2;
            points.push(
              new THREE.Vector3(Math.cos(angle) * i, Math.sin(angle) * i, 0)
            );
          }
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({ color: 0x444444 });
          const circle = new THREE.LineLoop(geometry, material);
          scene.add(circle);

          const label = document.createElement("div");
          label.className = "distance-label";
          label.innerText = `${i}m`;
          document.body.appendChild(label);
          distanceLabels.push({ element: label, distance: i });
        }
      }

      function updateDistanceLabels() {
        distanceLabels.forEach((label) => {
          const pos = new THREE.Vector3(label.distance, 0, 0);
          pos.project(camera);

          const x = (pos.x * 0.5 + 0.5) * window.innerWidth;
          const y = (-pos.y * 0.5 + 0.5) * window.innerHeight;

          label.element.style.left = `${x}px`;
          label.element.style.top = `${y}px`;
        });
      }

      function createGrid(size) {
        const gridHelper = new THREE.GridHelper(
          size * 2,
          size * 2,
          0x333333,
          0x333333
        );
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);
      }

      createDistanceCirclesWithLabels();
      createGrid(20);

      let pointClouds = {};
      const channelColors = [0xff0000, 0x0000ff, 0x00ff00, 0xffa500];
      const verticalAngles = [-1.07, 0, 1.07, 2];

      function initPointClouds(channelCount) {
        for (let i = 0; i < channelCount; i++) {
          const geometry = new THREE.BufferGeometry();
          const material = new THREE.PointsMaterial({
            color: channelColors[i % 4],
            size: 0.05, // ✅ 포인트 크기 조정
            transparent: true,
            opacity: 0.9,
          });

          pointClouds[i] = new THREE.Points(geometry, material);
          scene.add(pointClouds[i]);

          console.log(`✅ 채널 ${i} 포인트 클라우드 추가됨`); // ✅ 추가 확인 로그
        }
      }

      // ✅ LiDAR 포인트 클라우드 업데이트 함수 수정
      let ws = new WebSocket("ws://127.0.0.1:8000/ws/lidar");

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (!data.lidar_data || !data.distances) return;

        console.log("📡 WebSocket 데이터 수신:", data);

        updatePointCloud(data.lidar_data, 4);
        updateDistanceTable(data.distances); // ✅ 거리 테이블도 업데이트
      };

      function updatePointCloud(lidarData, channelCount) {
        const angleOffset = Math.PI / 4; // 45도(π/4) 반시계 회전

        for (let i = 0; i < channelCount; i++) {
          if (lidarData[i] && lidarData[i].length > 0) {
            const points = lidarData[i].map((p) => {
              const x =
                p.x * Math.cos(angleOffset) - p.y * Math.sin(angleOffset);
              const y =
                p.x * Math.sin(angleOffset) + p.y * Math.cos(angleOffset);
              return new THREE.Vector3(x, y, p.z);
            });

            if (pointClouds[i].geometry) {
              pointClouds[i].geometry.dispose();
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            pointClouds[i].geometry = geometry;
          }
        }
      }

      function updateDistanceTable(distances) {
        let table = document.getElementById("distance-table");
        let html = `<tr>
          <th>#</th>
          <th>각도 (°)</th>
          <th>채널 0 (m)</th>
          <th>채널 1 (m)</th>
          <th>채널 2 (m)</th>
          <th>채널 3 (m)</th>
      </tr>`;

        for (let i = 0; i < 400; i++) {
          // ✅ 각도 400개 기준으로 업데이트
          const angle = (i * 0.25).toFixed(2);

          // ✅ 거리 값 처리 (최대 50m 제한 & 소수 둘째 자리까지 표시)
          const formatDistance = (d) =>
            d !== undefined ? Math.min(50, parseFloat(d)).toFixed(2) : "-";

          const dist0 = formatDistance(distances[0]?.[i]?.distance);
          const dist1 = formatDistance(distances[1]?.[i]?.distance);
          const dist2 = formatDistance(distances[2]?.[i]?.distance);
          const dist3 = formatDistance(distances[3]?.[i]?.distance);

          html += `<tr>
          <td>${i}</td>
          <td>${angle}</td>
          <td>${dist0}</td>
          <td>${dist1}</td>
          <td>${dist2}</td>
          <td>${dist3}</td>
      </tr>`;
        }
        table.innerHTML = html;
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
        updateDistanceLabels();
      }
      animate();
      initPointClouds(4);
    </script>
  </body>
</html>
